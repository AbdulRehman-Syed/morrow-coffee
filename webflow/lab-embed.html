<!-- MORROW BREW STUDIO • Paste into a Webflow Code Embed after publishing your React site. -->
<div class="morrow-brew-studio" style="width:100%;overflow:hidden;background:#efe9de">
  <iframe
    class="morrow-brew-studio-frame"
    title="Morrow interactive pour-over coffee studio"
    src="https://YOUR-MORROW-SITE.example/?webflow=lab"
    width="100%"
    height="1350"
    loading="lazy"
    style="display:block;width:100%;height:1350px;border:0;background:#efe9de;"
    allow="fullscreen"
  ></iframe>
</div>
<script>
(function(){
  const frame=document.querySelector('.morrow-brew-studio-frame');
  if(!frame)return;
  const allowedOrigin=new URL(frame.src).origin;
  window.addEventListener('message',function(event){
    if(event.source!==frame.contentWindow || event.origin!==allowedOrigin)return;
    if(event.data?.type!=='morrow:lab-height')return;
    const height=Number(event.data.height);
    if(!Number.isFinite(height))return;
    frame.style.height=Math.max(550,Math.min(2200,height))+'px';
  });
})();
</script>
