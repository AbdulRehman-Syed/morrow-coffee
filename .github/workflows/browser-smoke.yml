name: Verify interactive website
on:
  pull_request:
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install website packages
        run: npm install --include=dev --no-audit --no-fund
      - name: Install browser smoke-test runner
        run: npm install --no-save --no-audit --no-fund playwright@1.56.1
      - name: Install Chromium browser
        run: npx playwright install --with-deps chromium
      - name: Start local website
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/morrow-vite.log 2>&1 &
          echo $! > /tmp/morrow-vite.pid
          for n in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/morrow-vite.log
          exit 1
      - name: Test actual browser interactions
        run: node scripts/browser-smoke.mjs
